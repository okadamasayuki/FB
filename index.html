<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>FB</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238a9199'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>

<header class="app-bar">
  <h1>FB</h1>
  <div class="bar-actions">
    <button id="btn-settings" class="icon-btn" type="button" title="設定" aria-label="設定">⚙</button>
  </div>
</header>

<main>
  <section class="toolbar" id="bulk-bar" hidden>
    <label class="check compact">
      <input id="select-all" type="checkbox">
      <span>全選択</span>
    </label>
    <span class="sel-count" id="sel-count"></span>
    <span class="spacer"></span>
    <button id="btn-del-selected" class="small danger" type="button">選択を削除</button>
    <button id="btn-del-all" class="small danger ghost" type="button">全削除</button>
  </section>

  <div id="files" class="file-list"></div>

  <p id="empty-state" class="empty" hidden>ファイルがありません</p>
  <p id="load-status" class="load-status"></p>
</main>

<div id="toasts" class="toasts" aria-live="polite"></div>

<dialog id="settings-dialog">
  <form method="dialog" class="dialog-head">
    <h2>設定</h2>
    <button class="icon-btn" value="close" aria-label="閉じる">✕</button>
  </form>

  <div class="dialog-body">
    <section>
      <h3>取得元</h3>
      <p class="hint">ここに並んでいるファイルを 1 時間おきに取りに行き、更新されていれば自動で差し替えます。</p>
      <textarea id="sources" rows="6" spellcheck="false" readonly></textarea>
      <div class="row">
        <button id="btn-copy-sources" class="small" type="button">コピー</button>
      </div>
      <p class="hint">増やしたいときは <code>owner/repo/フォルダ/ファイル名</code> を伝えてください。以降は自動で取りに行きます。</p>
    </section>

    <section>
      <h3>表示</h3>
      <p class="hint">削除したものはこの端末で見えなくなるだけです。元に戻すとすべて表示されます。</p>
      <div class="row">
        <button id="btn-reset" class="small" type="button">削除したものを元に戻す</button>
        <span id="reset-state" class="hint"></span>
      </div>
    </section>
  </div>
</dialog>

<script src="./assets/app.js"></script>
</body>
</html>
