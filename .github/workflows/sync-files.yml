name: Sync files from source repos

# 取得元が空のあいだは定時実行しない。data/sync.json に取得元を足したら
# schedule を戻して毎時動かす。手動実行はいつでもできる。
on:
  workflow_dispatch:

concurrency:
  group: sync-files
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - id: sync
        run: node scripts/sync-files.mjs
        env:
          # 公開リポジトリはこれで足りる。未認証で raw を叩くと共有 IP の
          # レート制限（429）を踏んでジョブごと落ちるので、必ず認証する。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 非公開リポジトリを取りに行くときだけ、Contents:Read の PAT を
          # SYNC_TOKEN シークレットに入れる。
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

      - name: Commit
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files data/files.json
          git commit -m "Sync files from source repositories"
          git push

  # Actions が push したコミットでは pages.yml の push トリガーが発火しないので、
  # ここから明示的に呼んで公開まで済ませる。
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
