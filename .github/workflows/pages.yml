name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch:
  # sync-files.yml から呼び出す。Actions が push したコミットでは
  # 上の push トリガーが発火しないため。
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は 1 本だけ。進行中のデプロイはキャンセルしない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Pages がまだ有効でないリポジトリでは、この build ジョブが先に有効化する。
  # deploy ジョブは github-pages 環境を参照するため、有効化前だと起動できない。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
