app:
  description: >-
    Dify のコードノード(Python3)で何ができるかを調べるだけのアプリです。
    使えるライブラリ・ファイルの読み書き・処理速度を確認して結果を表示します。
    プログラムをコードノードに直接貼れるか、プラグインが必要かの判断に使います。
  icon: 🔍
  icon_background: '#E0F2FE'
  mode: workflow
  name: コードノード 実行環境チェック
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: code
        id: start-source-code-target
        source: start
        sourceHandle: source
        target: code
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: code
          targetType: end
        id: code-source-end-target
        source: code
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: ''
          selected: false
          title: 開始
          type: start
          variables: []
        height: 54
        id: start
        position:
          x: 80
          y: 282
        positionAbsolute:
          x: 80
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |
            def main() -> dict:
                """Dify のコードノードで何ができるかを調べる。

                ここで OK になったものは、コードノードに直接プログラムを貼って動かせる。
                NG のものは、プラグイン(python_runner)を使う必要がある。
                """
                lines = []

                def probe(label, fn):
                    try:
                        lines.append(f"{label}: OK {fn()}".rstrip())
                    except Exception as e:
                        lines.append(f"{label}: NG ({type(e).__name__}: {str(e)[:70]})")

                # --- 実行環境 ---
                def _ver():
                    import sys

                    return sys.version.split()[0]

                probe("Python", _ver)

                # --- ライブラリ ---
                lines.append("")
                lines.append("[ライブラリ]")
                for name in ["json", "csv", "re", "math", "datetime", "base64",
                             "pandas", "numpy", "openpyxl", "requests"]:
                    def _imp(n=name):
                        m = __import__(n)
                        return getattr(m, "__version__", "")
                    probe(f"  {name}", _imp)

                # --- ファイルの読み書き(Excel を扱えるかの分かれ目) ---
                lines.append("")
                lines.append("[ファイル操作]")

                def _file():
                    with open("/tmp/dify_check.txt", "w") as f:
                        f.write("hello")
                    with open("/tmp/dify_check.txt") as f:
                        return "読み書きできた(" + f.read() + ")"

                probe("  一時ファイル", _file)

                def _listdir():
                    import os

                    return f"{len(os.listdir('/tmp'))} 件見えた"

                probe("  フォルダ一覧", _listdir)

                # --- 処理時間の余裕(既定は 15 秒で打ち切り) ---
                lines.append("")
                lines.append("[処理時間]")

                def _loop():
                    import time

                    t0 = time.time()
                    total = 0
                    for i in range(3_000_000):
                        total += i
                    return f"300万回の足し算に {time.time() - t0:.2f} 秒"

                probe("  計算速度", _loop)

                # --- 判定 ---
                text = "\n".join(lines)
                can_excel = "  openpyxl: OK" in text and "  一時ファイル: OK" in text
                lines.append("")
                lines.append("=" * 46)
                if can_excel:
                    lines.append("判定: Excel を扱うプログラムもコードノードで動く可能性あり")
                    lines.append("      ただしファイルの受け渡し(添付→コード、コード→")
                    lines.append("      ダウンロード)は別途プラグインが必要です。")
                else:
                    lines.append("判定: Excel を読み書きするプログラムはコードノードでは動きません。")
                    lines.append("      → python_runner プラグインを使ってください。")
                    lines.append("      計算だけのプログラムなら、上の OK の範囲で動きます。")
                lines.append("=" * 46)

                return {"result": "\n".join(lines)}
          code_language: python3
          desc: 使えるライブラリ・ファイル操作・処理速度を調べます
          outputs:
            result:
              children: null
              type: string
          selected: false
          title: 実行環境を調べる
          type: code
          variables: []
        height: 54
        id: code
        position:
          x: 420
          y: 282
        positionAbsolute:
          x: 420
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: ''
          outputs:
            - value_selector:
                - code
                - result
              variable: result
          selected: false
          title: 終了
          type: end
        height: 90
        id: end
        position:
          x: 760
          y: 282
        positionAbsolute:
          x: 760
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1
