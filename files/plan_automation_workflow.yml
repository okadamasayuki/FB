app:
  description: >-
    資金実績 Excel(.xlsm/.xlsx)と、Excel 抜粋エディタで書き出した手順書を入力すると、
    手順書のとおりに抜き出して入力用一括 Excel を作り、資金計画プログラムを実行します。
    実行レポート(print 出力を含む)の表示と、出力ファイルのダウンロードができます。
  icon: 💴
  icon_background: '#E0F2FE'
  mode: workflow
  name: 資金計画自動生成
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables:
    - description: >-
        社内のコア Python(資金計画プログラム)の本文をここに丸ごと貼り付ける。
        コードはプラグイン内でのみ実行され、外部には送信されない。
        空のままだと同梱のモック実装が動く。
      name: CORE_CODE
      selector:
        - env
        - CORE_CODE
      value: ''
      value_type: string
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: tool
        id: start-source-tool-target
        source: start
        sourceHandle: source
        target: tool
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: tool
          targetType: end
        id: tool-source-end-target
        source: tool
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: ''
          selected: false
          title: 開始
          type: start
          variables:
            - allowed_file_extensions:
                - .xlsm
                - .xlsx
              allowed_file_types:
                - custom
              allowed_file_upload_methods:
                - local_file
              label: 元データExcel
              max_length: 48
              options: []
              required: true
              type: file
              variable: source_file
            - allowed_file_extensions:
                - .txt
                - .md
              allowed_file_types:
                - custom
              allowed_file_upload_methods:
                - local_file
              label: 手順書ファイル(Excel抜粋エディタで書き出したもの)
              max_length: 48
              options: []
              required: true
              type: file
              variable: procedure_file
            - label: 実績データの年度(西暦)
              max_length: 48
              options: []
              required: true
              type: number
              variable: fiscal_year
        height: 142
        id: start
        position:
          x: 80
          y: 282
        positionAbsolute:
          x: 80
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: 手順書のとおりに抜き出し → 入力用一括Excel生成 → 資金計画プログラム実行
          is_team_authorization: false
          provider_id: okadamasayuki/plan_automation/plan_automation
          provider_name: okadamasayuki/plan_automation/plan_automation
          provider_type: builtin
          selected: false
          title: 資金計画を生成
          tool_configurations: {}
          tool_label: 資金計画を生成
          tool_name: generate_plan
          tool_parameters:
            source_file:
              type: variable
              value:
                - start
                - source_file
            procedure_file:
              type: variable
              value:
                - start
                - procedure_file
            fiscal_year:
              type: variable
              value:
                - start
                - fiscal_year
            core_code:
              type: mixed
              value: '{{#env.CORE_CODE#}}'
          type: tool
        height: 168
        id: tool
        position:
          x: 420
          y: 282
        positionAbsolute:
          x: 420
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: ''
          outputs:
            - value_selector:
                - tool
                - text
              variable: log
            - value_selector:
                - tool
                - files
              variable: files
          selected: false
          title: 終了
          type: end
        height: 116
        id: end
        position:
          x: 760
          y: 282
        positionAbsolute:
          x: 760
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1
